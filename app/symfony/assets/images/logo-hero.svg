<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0055A4"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#EF4135"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Main container -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="220" height="120" rx="20" fill="#FFFFFF"/>

    <!-- Tricolor top border -->
    <rect x="10" y="10" width="73" height="5" rx="2" fill="#0055A4"/>
    <rect x="83" y="10" width="74" height="5" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="157" y="10" width="73" height="5" rx="2" fill="#EF4135"/>
  </g>

  <!-- Diverse group of people united -->

  <!-- Person 1 - Light European skin -->
  <circle cx="40" cy="50" r="12" fill="#FDEBD0"/>
  <circle cx="37" cy="48" r="2" fill="#5D4E37"/>
  <circle cx="43" cy="48" r="2" fill="#5D4E37"/>
  <path d="M37 54 Q40 57, 43 54" stroke="#5D4E37" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="40" cy="80" rx="10" ry="16" fill="#0055A4"/>
  <!-- Arm reaching -->
  <path d="M50 72 Q65 65, 75 70" stroke="#FDEBD0" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Person 2 - Medium brown/Latino skin -->
  <circle cx="80" cy="45" r="13" fill="#C68642"/>
  <circle cx="76" cy="43" r="2.5" fill="#3D2314"/>
  <circle cx="84" cy="43" r="2.5" fill="#3D2314"/>
  <path d="M76 50 Q80 54, 84 50" stroke="#3D2314" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="80" cy="78" rx="11" ry="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Arms open -->
  <path d="M69 68 Q55 60, 50 65" stroke="#C68642" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M91 68 Q105 60, 110 65" stroke="#C68642" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Person 3 - Dark African skin -->
  <circle cx="120" cy="45" r="13" fill="#8B5A2B"/>
  <circle cx="116" cy="43" r="2.5" fill="#2C1810"/>
  <circle cx="124" cy="43" r="2.5" fill="#2C1810"/>
  <path d="M116 50 Q120 54, 124 50" stroke="#2C1810" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="120" cy="78" rx="11" ry="18" fill="#EF4135"/>
  <!-- Arms welcoming -->
  <path d="M109 68 Q95 60, 90 65" stroke="#8B5A2B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M131 68 Q145 62, 150 68" stroke="#8B5A2B" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Person 4 - Asian skin tone -->
  <circle cx="160" cy="48" r="12" fill="#F5DEB3"/>
  <circle cx="156" cy="46" r="2" fill="#2C1810"/>
  <circle cx="164" cy="46" r="2" fill="#2C1810"/>
  <path d="M156 52 Q160 55, 164 52" stroke="#2C1810" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="160" cy="78" rx="10" ry="16" fill="#6B7280"/>
  <!-- Arm reaching -->
  <path d="M150 70 Q140 65, 132 70" stroke="#F5DEB3" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Person 5 - Very dark skin -->
  <circle cx="195" cy="50" r="11" fill="#5D4037"/>
  <circle cx="192" cy="48" r="2" fill="#1A1A1A"/>
  <circle cx="198" cy="48" r="2" fill="#1A1A1A"/>
  <path d="M192 54 Q195 57, 198 54" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="195" cy="78" rx="9" ry="15" fill="#0055A4"/>
  <!-- Arm joining -->
  <path d="M186 70 Q175 65, 170 70" stroke="#5D4037" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Unity arc connecting everyone -->
  <path d="M35 35 Q120 15, 200 35" stroke="#EF4135" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8,4"/>

  <!-- Hearts floating -->
  <path d="M60 28 C62 24, 66 24, 66 28 C66 32, 60 36, 60 36 C60 36, 54 32, 54 28 C54 24, 58 24, 60 28" fill="#EF4135" opacity="0.8"/>
  <path d="M180 25 C181.5 22, 184 22, 184 25 C184 28, 180 30, 180 30 C180 30, 176 28, 176 25 C176 22, 178.5 22, 180 25" fill="#0055A4" opacity="0.7"/>

  <!-- Stars -->
  <circle cx="100" cy="25" r="3" fill="#0055A4" opacity="0.5"/>
  <circle cx="140" cy="22" r="2.5" fill="#EF4135" opacity="0.5"/>

  <!-- Text area - "Ensemble" message -->
  <text x="120" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">Ensemble vers la citoyennete</text>

  <!-- Tricolor bottom accent -->
  <rect x="40" y="125" width="50" height="4" rx="2" fill="#0055A4"/>
  <rect x="95" y="125" width="50" height="4" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <rect x="150" y="125" width="50" height="4" rx="2" fill="#EF4135"/>
</svg>
